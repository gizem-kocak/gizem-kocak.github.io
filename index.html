function finish(){
  // swap the assembled pieces for the original single-path logo so the
  // final frame is exactly the source artwork, with no seams between parts
  const g = document.createElementNS(NS,'path');
  g.setAttribute('id','exact');
  g.setAttribute('d', EXACT);
  g.setAttribute('fill-rule','evenodd');
  svg.appendChild(g);
  parts.forEach(p => p.el.remove());
}

if (matchMedia('(prefers-reduced-motion: reduce)').matches){
  finish();
} else {
  const t0 = performance.now();
  const buf = parts.map(p => p.final.map(function(){return [0,0];}));

  function frame(now){
    const t = (now - t0)/1000;
    let done = true;

    for(let pi=0; pi<parts.length; pi++){
      const p = parts[pi];
      const local = t - p.delay;
      if(local < 0){ p.el.setAttribute('d',''); done = false; continue; }

      const g = clamp01(local / GROW);
      const f = clamp01((local - GROW) / FORM);
      if(f < 1) done = false;

      const eg = ease(g), ef = ease(f);
      const out = buf[pi];

      for(let i=0;i<p.n;i++){
        // tip-first growth: a point only moves once the vine has grown
        // far enough along the path to reach it
        const gp = ease(clamp01((eg - p.u[i]*0.82) / 0.18));
        const sx = p.seed[0] + (p.flat[i][0] - p.seed[0]) * gp;
        const sy = p.seed[1] + (p.flat[i][1] - p.seed[1]) * gp;
        // the thin organic line then resolves into exact logo geometry
        out[i][0] = sx + (p.final[i][0] - sx) * ef;
        out[i][1] = sy + (p.final[i][1] - sy) * ef;
      }
      p.el.setAttribute('d', d_of(out));
    }

    if(done){ finish(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
