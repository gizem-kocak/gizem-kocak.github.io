<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gizem Koçak</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#fff;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;}
  svg{position:fixed;inset:0;width:100%;height:100%;display:block;}
  path{fill:#000;stroke:#000;stroke-width:1.1;stroke-linejoin:round;}
  #exact{stroke:none;}

  /* ── overlay that catches clicks during the logo phase ── */
  #click-layer{position:fixed;inset:0;z-index:10;cursor:pointer;}

  /* ── homepage content, hidden initially ── */
  #homepage{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    opacity:0;pointer-events:none;
    transition:opacity 0.6s ease-out;
  }
  #homepage.visible{opacity:1;pointer-events:auto;}

  /* ── name reveal ── */
  .name-wrap{
    position:relative;overflow:hidden;
    margin-bottom:2.4rem;
  }
  .name-wrap h1{
    font-size:clamp(2rem,5.5vw,4.2rem);
    font-weight:300;letter-spacing:0.04em;
    color:#000;line-height:1.15;
    transform:translateY(100%);
    transition:transform 0.9s cubic-bezier(0.22,1,0.36,1);
  }
  .name-wrap h1.revealed{transform:translateY(0);}

  .name-wrap::after{
    content:'';display:block;width:48px;height:1px;
    background:#000;margin:1.2rem auto 0;
    transform:scaleX(0);transform-origin:left;
    transition:transform 0.8s cubic-bezier(0.22,1,0.36,1) 0.3s;
  }
  .name-wrap::after.revealed{transform:scaleX(1);}

  /* ── portfolio grid ── */
  .portfolio{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:2rem;max-width:960px;width:90%;
    opacity:0;transform:translateY(30px);
    transition:opacity 0.8s ease-out 0.5s,transform 0.8s cubic-bezier(0.22,1,0.36,1) 0.5s;
  }
  .portfolio.visible{opacity:1;transform:translateY(0);}

  .project{
    position:relative;aspect-ratio:4/3;
    background:#f0f0f0;overflow:hidden;
    cursor:pointer;
  }
  .project::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,#e8e8e8 0%,#d0d0d0 100%);
    transition:transform 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  .project:hover::before{transform:scale(1.05);}
  .project-label{
    position:absolute;bottom:1.2rem;left:1.4rem;
    font-size:0.82rem;font-weight:400;letter-spacing:0.06em;
    color:#333;z-index:1;
  }
  .project-number{
    position:absolute;top:1.2rem;right:1.4rem;
    font-size:0.7rem;font-weight:300;letter-spacing:0.08em;
    color:#888;z-index:1;
  }

  /* ── nav ── */
  .nav{
    position:fixed;top:2rem;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:0 3rem;z-index:20;
    opacity:0;transition:opacity 0.6s ease-out 0.8s;
  }
  .nav.visible{opacity:1;}
  .nav a{
    font-size:0.75rem;font-weight:400;letter-spacing:0.1em;
    text-transform:uppercase;color:#000;text-decoration:none;
    transition:opacity 0.3s;
  }
  .nav a:hover{opacity:0.5;}

  /* ── footer ── */
  .footer{
    position:fixed;bottom:2rem;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 3rem;z-index:20;
    opacity:0;transition:opacity 0.6s ease-out 1s;
  }
  .footer.visible{opacity:1;}
  .footer span{
    font-size:0.68rem;font-weight:300;letter-spacing:0.06em;
    color:#999;
  }
</style>
</head>

<div id="homepage">
  <nav class="nav" id="nav">

    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="name-wrap">
    <h1 id="name">Gizem Koçak</h1>
  </div>

  <div class="portfolio" id="portfolio">
    <div class="project">
      <span class="project-number">01</span>
      <span class="project-label">Residential — Istanbul</span>
    </div>
    <div class="project">
      <span class="project-number">02</span>

    </div>
    <div class="project">
      <span class="project-number">03</span>
      <span class="project-label">Urban Pavilion — Antalya</span>

  </div>

  <footer class="footer" id="footer">
    <span>© 2025 Gizem Koçak</span>
    <span>Architecture & Design</span>
  </footer>
</div>
