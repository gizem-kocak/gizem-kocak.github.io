const LOGO_W=522, LCX=261, LCY=204;

/* Scale the stage so the finished mark reads well on any screen shape.
   Vine seeds live far outside this box, so a line always enters from
   beyond the edge of the screen rather than appearing in open space. */
function fitStage(){
  const vw=innerWidth, vh=innerHeight;
  const target=Math.max(140, Math.min(Math.min(vw,vh)*0.44, 360));
  const scale=target/LOGO_W;
  const bw=vw/scale, bh=vh/scale;
  document.getElementById('stage').setAttribute(
    'viewBox',(LCX-bw/2)+' '+(LCY-bh/2)+' '+bw+' '+bh);
}
