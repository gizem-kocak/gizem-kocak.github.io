<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gizem Koçak</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:#FFFFFF;
    display:flex; align-items:center; justify-content:center;
  }
  .logo{
    width:min(34vw, 360px);
    height:auto;
    opacity:0;
    transform:translateY(8px);
    animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes in{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .logo{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>
  <img class="logo" src="gk-logo.png" alt="GK — Gizem Koçak">
</body>
</html>
